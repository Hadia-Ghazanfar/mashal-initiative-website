name: Move uploaded site file to index.html
on:
  push:
    paths:
      - '.github/workflows/move-to-index.yml'
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file to index.html
        run: |
          mv mash-al-initiative-website.html index.html
          rm .github/workflows/move-to-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -q mash-al-initiative-website.html .github/workflows/move-to-index.yml
          git commit -m "Amanah Before Allah icon changed to gold Rs coin"
          git push
