name: Move uploaded site file to index.html

on:
  push:
    paths:
      - '.github/workflows/move-to-index.yml'

permissions:
  contents: write

jobs:
  move-site-file:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Move uploaded file to index.html
        run: |
          mv mash-al-initiative-website.html index.html
          rm .github/workflows/move-to-index.yml
      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f mash-al-initiative-website.html .github/workflows/move-to-index.yml 2>/dev/null || true
          git commit -m "Update website: side rail, trust section, blog restyle, remove stock images, mobile nav"
          git push
